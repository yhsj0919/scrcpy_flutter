name: scrcpy_flutter
description: Embeddable Flutter client components for scrcpy-based Android control.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'

dependencies:
  adb_client:
    path: packages/adb_client
  adb_client_process:
    path: packages/adb_client_process
  crypto: ^3.0.7
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.scrcpy.flutter
        pluginClass: ScrcpyFlutterPlugin
      windows:
        pluginClass: ScrcpyFlutterPluginCApi
